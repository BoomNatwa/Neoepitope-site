<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BIO adventure</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Chakra Petch', sans-serif;
            /* Animated gradient background */
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }

        @keyframes gradient {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .logo-gradient-text {
            background: linear-gradient(to right, #6d28d9, #14b8a6);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Custom focus style for inputs */
        .input-focus:focus-within {
            border-color: #a78bfa;
            box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.3);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md mx-auto">
        <!-- Logo -->
        <div class="text-center mb-8">
            <a href="../index.html" class="inline-block transition-transform hover:scale-105">
                <h1 class="text-3xl font-bold logo-gradient-text">BIO</h1>
                <h1 class="text-lg font-semibold text-purple-700 -mt-2">adventure</h1>
                <h1 class="text-xs text-white tracking-widest">COMPANY LIMITED</h1>            
            </a>
        </div>

        <!-- Glassmorphism Card -->
        <div class="bg-white/70 backdrop-blur-xl border border-white/30 rounded-2xl shadow-2xl p-8">
            <h2 class="text-3xl font-bold text-center text-gray-900 mb-2">Welcome Back</h2>
            <p class="text-center text-gray-600 mb-8">Login to access your account.</p>
            
            <form action="#">
                <!-- Email Input with Icon -->
                <div class="mb-4 relative">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                    </div>
                    <input type="email" id="email" name="email" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-purple-500 focus:border-purple-500 block w-full pl-10 p-3 transition" placeholder="your.email@company.com" required>
                </div>

                <!-- Password Input with Icon -->
                <div class="mb-4 relative">
                     <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                    </div>
                    <input type="password" id="password" name="password" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-purple-500 focus:border-purple-500 block w-full pl-10 p-3 transition" placeholder="••••••••" required>
                </div>

                <!-- Keypass Input with Icon -->
                <div class="mb-6 relative">
                     <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                        <svg class="w-5 h-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 8a6 6 0 01-7.743 5.743L10 14l-1 1-1 1H6v2H2v-4l4.257-4.257A6 6 0 1118 8zm-6-4a1 1 0 100 2 1 1 0 000-2z" clip-rule="evenodd" /></svg>
                    </div>
                    <input type="text" id="keypass" name="keypass" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-purple-500 focus:border-purple-500 block w-full pl-10 p-3 transition" placeholder="Your Keypass">
                </div>
                
                <!-- Login Button -->
                <div class="mb-4">
                    <button type="submit" class="w-full bg-purple-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-purple-700 focus:outline-none focus:ring-4 focus:ring-purple-300 transition-all duration-300 transform hover:scale-105">
                        Secure Login
                    </button>
                </div>

                <div class="flex items-center justify-between text-sm text-gray-600">
                    <div class="flex items-center">
                        <input id="remember" type="checkbox" value="" class="w-4 h-4 border-gray-300 rounded bg-gray-50 focus:ring-3 focus:ring-purple-300">
                        <label for="remember" class="ml-2 font-medium">Remember me</label>
                    </div>
                    <a href="#" class="font-medium text-purple-600 hover:underline">Forgot password?</a>
                </div>
            </form>

            <!-- Divider -->
            <div class="my-6 flex items-center">
                <div class="flex-grow border-t border-gray-300"></div>
                <span class="flex-shrink mx-4 text-gray-500 text-sm">Or</span>
                <div class="flex-grow border-t border-gray-300"></div>
            </div>

            <!-- Register & Contact Buttons -->
            <div class="space-y-3 text-center">
                 <p class="text-sm text-gray-600">
                    New to BIO adventure? 
                    <a href="Register.html" class="font-bold text-purple-600 hover:underline">Create an account</a>
                </p>
                 <p class="text-sm text-gray-600">
                    Need help? 
                    <a href="Contact.html" class="font-bold text-teal-600 hover:underline">Contact Support</a>
                </p>
            </div>
        </div>
        
         <p class="text-center text-white/70 text-xs mt-8">
            &copy; 2025 by Bio-adventure. Created with NM
        </p>
    </div>

</body>
</html>
