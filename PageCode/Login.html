<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BIO adventure</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Using a gradient background that matches the site's theme */
            background: linear-gradient(135deg, #f3e8ff, #e0f2f1);
        }
        .logo-gradient-text {
            background: linear-gradient(to right, #6d28d9, #14b8a6);
            -webkit-background-clip: text;
            background-clip: text; /* Added for compatibility */
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md mx-auto">
        <div class="text-center mb-8">
            <!-- Logo -->
            <a href="../index.html" class="inline-block">
                <h1 class="text-5xl font-bold logo-gradient-text">BIO</h1>
                <span class="text-2xl font-semibold text-purple-700 -mt-2">adventure</span>
            </a>
        </div>

        <div class="bg-white/80 backdrop-blur-sm border border-gray-200 rounded-2xl shadow-xl p-8">
            <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Welcome Back</h2>
            <form action="#">
                <!-- Email Input -->
                <div class="mb-4">
                    <label for="email" class="block mb-2 text-sm font-medium text-gray-600">Email</label>
                    <input type="email" id="email" name="email" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-purple-500 focus:border-purple-500 block w-full p-2.5 transition" placeholder="your.email@company.com">
                </div>

                <!-- Password Input -->
                <div class="mb-4">
                    <label for="password" class="block mb-2 text-sm font-medium text-gray-600">Password</label>
                    <input type="password" id="password" name="password" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-purple-500 focus:border-purple-500 block w-full p-2.5 transition" placeholder="••••••••">
                </div>

                <!-- Keypass Input -->
                <div class="mb-6">
                    <label for="keypass" class="block mb-2 text-sm font-medium text-gray-600">Keypass</label>
                    <input type="text" id="keypass" name="keypass" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-purple-500 focus:border-purple-500 block w-full p-2.5 transition">
                </div>
                
                <!-- Login Button with requested animations -->
                <div class="mb-4">
                    <button type="submit" class="w-full bg-purple-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-purple-700 hover:animate-pulse focus:animate-bounce focus:outline-none focus:ring-4 focus:ring-purple-300 transition-all duration-300">
                        Login
                    </button>
                </div>

                <div class="text-center text-sm text-gray-500">
                    <a href="#" class="font-medium text-purple-600 hover:underline">Forgot password?</a>
                </div>

                 <!-- Checkbox -->
                <div class="flex items-center justify-center mt-6">
                    <div class="flex items-center h-5">
                        <input id="remember" type="checkbox" value="" class="w-4 h-4 border-gray-300 rounded bg-gray-50 focus:ring-3 focus:ring-purple-300">
                    </div>
                    <label for="remember" class="ms-2 text-sm font-medium text-gray-600">
                        Accept 
                        <a href="Rule/our_confidencial.html" class="text-purple-600 hover:underline">our confidencial</a>
                    </label>
                </div>
            </form>
        </div>
         <p class="text-center text-gray-500 text-xs mt-8">
            &copy;2025 BIO adventure COMPANY LIMITED. All rights reserved.
        </p>
    </div>

</body>
</html>
