<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - BIO adventure</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Chakra Petch', sans-serif;
            /* Animated gradient background to match the login page */
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }

        @keyframes gradient {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .logo-gradient-text {
            background: linear-gradient(to right, #6d28d9, #14b8a6);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-gradientActive-text{
            background: linear-gradient(-45deg, #6d28d9, #e73c7e, #23a6d5, #23d5ab);
            -webkit-background-clip: text;
            background-clip: text;
            animation: gradient 15s ease infinite;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md mx-auto">
        <!-- Logo -->
        <div class="text-center mb-8">
            <a href="../index.html" class="inline-block transition-transform hover:scale-105">
                <h1 class="text-3xl font-bold logo-gradientActive-text">BIO</h1>
                <h1 class="text-lg font-semibold logo-gradientActive-text -mt-2">adventure</h1>
                <h1 class="text-xs font-semibold text-white tracking-widest">COMPANY LIMITED</h1>
            </a>
        </div>

        <!-- Glassmorphism Card -->
        <div class="bg-white/70 backdrop-blur-xl border border-white/30 rounded-2xl shadow-2xl p-8">
            <h2 class="text-3xl font-bold text-center text-gray-900 mb-2">Get in Touch</h2>
            <p class="text-center text-gray-600 mb-8">We'd love to hear from you. Please fill out the form below.</p>
            
            <form action="#">
                <!-- Name Input with Icon -->
                <div class="mb-4 relative">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                        <svg class="w-5 h-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                          <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
                        </svg>
                    </div>
                    <input type="text" id="name" name="name" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-purple-500 focus:border-purple-500 block w-full pl-10 p-3 transition" placeholder="Your Name" required>
                </div>

                <!-- Email Input with Icon -->
                <div class="mb-4 relative">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                    </div>
                    <input type="email" id="email" name="email" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-purple-500 focus:border-purple-500 block w-full pl-10 p-3 transition" placeholder="your.email@company.com" required>
                </div>

                <!-- Message Textarea -->
                <div class="mb-6 relative">
                     <div class="absolute top-3 left-0 flex items-center pl-3 pointer-events-none">
                        <svg class="w-5 h-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />
                        </svg>
                    </div>
                    <textarea id="message" name="message" rows="4" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-purple-500 focus:border-purple-500 block w-full pl-10 p-3 transition" placeholder="Your message..." required></textarea>
                </div>
                
                <!-- Send Message Button -->
                <div class="mb-4">
                    <button type="submit" class="w-full bg-teal-500 text-white font-bold py-3 px-4 rounded-lg hover:bg-teal-600 focus:outline-none focus:ring-4 focus:ring-teal-300 transition-all duration-300 transform hover:scale-105">
                        Send Message
                    </button>
                </div>
            </form>

            <!-- Back to Login Link -->
            <div class="text-center mt-6">
                 <a href="Login.html" class="text-sm font-medium text-gray-600 hover:text-purple-700 transition">
                    &larr; Back to Login
                </a>
            </div>
        </div>
        
         <p class="text-center text-white/70 text-xs mt-8">
            &copy; 2025 by Bio-adventure. Created with NM
        </p>
    </div>

</body>
</html>
